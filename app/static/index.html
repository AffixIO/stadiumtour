    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AffixIO Access Arena",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Web Browser",
        "description": "Interactive educational simulation of venue access-control checkpoints with synthetic proof verification and live anonymous telemetry.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
        "publisher": { "@type": "Organization", "name": "AffixIO" }
      }
    </script>

  </head>
  <body>
    <div id="start-screen">
      <div class="start-panel">
        <p class="kicker">Night session  ·  Simulated venue</p>
        <h1>AffixIO Access Arena</h1>
        <p>
          This is a fictional educational simulation. Credentials, proofs, attendees, and cryptographic material are synthetic.
          Verification logic models policy flow, it is not production cryptography.
        </p>
        <button id="start-button" type="button">Enter Arena</button>
        <p id="start-error" class="hidden"></p>
      </div>
    </div>

    <canvas id="game-canvas" aria-label="3D arena view"></canvas>
    <div id="vignette" aria-hidden="true"></div>

    <div id="hud">
      <div id="zone-card" class="hud-card top-left"></div>
      <div id="persona-card" class="hud-card top-centre">
        <label for="persona-select">Persona</label>
        <select id="persona-select" aria-label="Select active persona"></select>
      </div>
      <div id="pulse-card" class="hud-card top-right"></div>

      <div id="interaction-prompt"></div>
      <div id="crosshair" aria-hidden="true">+</div>

      <div id="proof-inspector" class="hud-panel hidden"></div>
      <div id="event-feed" class="hud-panel"></div>

      <div id="minimap-panel" class="hud-panel hidden">
        <canvas id="minimap" width="260" height="200"></canvas>
      </div>
      <div id="help-panel" class="hud-panel hidden"></div>
      <div id="attack-panel" class="hud-panel hidden"></div>
      <div id="soc-panel" class="hud-panel hidden"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three.module.js?v=arena3"
        }
      }
    </script>
    <script type="module" src="/static/js/main.js?v=arena3"></script>
